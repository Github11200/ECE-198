; PlatformIO project for the ECE 198 wearable firmware
; ESP32 Dev Module + SSD1306 128x64 OLED (the BMX160 IMU on the board is unused)
;
; The sketch stays in Arduino layout (ECE198-OLED-IMU.ino at the root of this
; folder, extra sources in src/), so the same files still compile with
; arduino-cli / the Arduino IDE. PlatformIO treats this folder as its src_dir.
;
; Common commands (run from this folder, or with --project-dir from the repo
; root):
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial log at 115200 baud
;   pio run -t clean        remove build output
;   pio run -t compiledb    regenerate compile_commands.json for IntelliSense
;   pio test -e native      host unit tests (feedback logic + Convex protocol)

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ ^8.0.0
board = esp32dev
framework = arduino

; Same serial speed as Serial.begin(115200) in the sketch.
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

upload_speed = 921600

; The Convex client (JSON + WebSocket) does not fit the default 1.3 MB app
; slot; huge_app gives the app 3 MB (no OTA, which this project doesn't use).
board_build.partitions = huge_app.csv

; Keep the Arduino build cache, the reference examples and the hidden
; PlatformIO state out of the compile: only the sketch and src/ are sources.
build_src_filter =
    +<*>
    -<.arduino-build/>
    -<.pio/>
    -<examples/>
    -<test/>
    -<tools/>

lib_deps =
    adafruit/Adafruit BusIO @ ^1.16
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit SSD1306 @ ^2.5
    links2004/WebSockets @ ^2.7

; Host-side unit tests for the hardware-independent code: the Convex sync
; protocol/state machine and the OLED feedback model. No board needed.
[env:native]
platform = native
build_flags = -std=gnu++17 -Isrc -DUNITY_INCLUDE_DOUBLE -Wall -Wextra -Wno-unused-parameter
build_src_filter =
    -<*>
    +<src/feedback/>
    +<src/convex/value.cpp>
    +<src/convex/protocol.cpp>
    +<src/convex/base_client.cpp>
test_build_src = yes
